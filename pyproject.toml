[project]
name = "ai-code-review-bot"
version = "1.0.0"
description = "AI-powered code review bot that reviews PRs for bugs, security flaws, and style issues"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
