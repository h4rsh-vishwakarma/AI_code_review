name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI Code Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: groq
          MODEL_NAME: llama-3.3-70b-versatile
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TEAM_CONFIG: ${{ vars.TEAM_CONFIG || '{}' }}
        run: |
          echo "=== Quick API sanity check ==="
          python -c "
          from groq import Groq
          import os
          client = Groq(api_key=os.environ.get('GROQ_API_KEY', ''))
          try:
              r = client.chat.completions.create(model='llama-3.3-70b-versatile', messages=[{'role':'user','content':'say OK'}], max_tokens=5)
              print('API OK:', r.choices[0].message.content)
          except Exception as e:
              print('API FAILED:', type(e).__name__, e)
          "
          echo "=== Running review ==="
          python src/main.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --config ".reviewbot.yml" \
            --enable-ast \
            --min-severity suggestion 2>&1
